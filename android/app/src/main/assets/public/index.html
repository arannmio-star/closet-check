<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#2D6A5B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>옷장체크</title>
<style>
/* 레이아웃: 한 손 조작용 단일 칼럼, 하단 탭 4개, 등록·상세는 아래에서 올라오는 시트 */
:root {
  --bg: #F2F4F1;
  --surface: #FFFFFF;
  --surface2: #E7ECE8;
  --ink: #18211F;
  --muted: #5B6864;
  --line: #D3DAD5;
  --accent: #2D6A5B;
  --on-accent: #FFFFFF;
  --buy: #2D6A5B;
  --hold: #9A6200;
  --skip: #3A5C8C;
  --danger: #B3402F;
  --font: "Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1513; --surface: #182120; --surface2: #222D2A; --ink: #E8EEEB; --muted: #9DABA6;
    --line: #2C3A36; --accent: #6FC2AE; --on-accent: #0B1A16; --buy: #6FC2AE; --hold: #E3AC45;
    --skip: #8CB2E4; --danger: #EE8B79; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1513; --surface: #182120; --surface2: #222D2A; --ink: #E8EEEB; --muted: #9DABA6;
  --line: #2C3A36; --accent: #6FC2AE; --on-accent: #0B1A16; --buy: #6FC2AE; --hold: #E3AC45;
  --skip: #8CB2E4; --danger: #EE8B79; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5;
  padding-block: calc(14px + max(env(safe-area-inset-top, 0px), var(--safe-area-inset-top, 0px))) 104px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
#app { max-width: 560px; margin: 0 auto; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h2 { font-size: 18px; font-weight: 700; }
h3 { font-size: 14px; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.stack { display: flex; flex-direction: column; gap: 18px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { min-width: 0; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

/* 상단 */
.top { display: flex; align-items: center; justify-content: space-between; padding: 6px 0 14px; }
.brand { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
.tag { font-size: 13px; color: var(--muted); margin-top: 2px; }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 10px; color: var(--muted); }
.icon-btn:active { background: var(--surface2); }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* 버튼 */
.btn { min-height: 44px; padding: 10px 16px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font-weight: 500; flex: 1 1 auto; text-align: center; }
.btn:active { background: var(--surface2); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 700; }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.btn[disabled] { opacity: .45; cursor: default; }
.ghost { color: var(--muted); min-height: 44px; padding: 0 6px; }

.hero { background: var(--accent); color: var(--on-accent); border-radius: 14px; padding: 18px; text-align: left; width: 100%; display: flex; flex-direction: column; gap: 4px; }
.hero b { font-size: 19px; }
.hero span { font-size: 13px; opacity: .88; }

.panel-box { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.counts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.count b { display: block; font-size: 26px; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; }
.count span { font-size: 12px; color: var(--muted); }
.notice { border: 1px solid var(--hold); color: var(--hold); border-radius: 10px; padding: 10px 12px; font-size: 13px; background: var(--surface); }

/* 탭 */
.seg { display: flex; background: var(--surface2); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { flex: 1; min-height: 38px; border-radius: 8px; color: var(--muted); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { min-height: 38px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; }
.chip[aria-pressed="true"], .chip[aria-checked="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 700; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; }
.chips.scroll .chip { flex: 0 0 auto; }

/* 카드·그리드 */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 480px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.card { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: block; width: 100%; }
.card .ph { aspect-ratio: 3 / 4; background: var(--surface2); }
.card .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .cap { padding: 8px 10px 10px; }
.card .cap b { display: block; font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .cap span { font-size: 12px; color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.strip { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
.strip .card { flex: 0 0 96px; width: 96px; }
.strip .card .cap { display: none; }

.empty { text-align: center; padding: 36px 16px; display: flex; flex-direction: column; gap: 10px; align-items: center; border: 1px dashed var(--line); border-radius: 12px; background: var(--surface); }
.empty p { color: var(--muted); max-width: 30ch; }
.empty .btn { flex: 0 0 auto; }

/* 시트 */
#sheet { position: fixed; inset: 0; z-index: 30; }
.scrim { position: absolute; inset: 0; background: rgba(8, 14, 12, .55); }
.panel { position: absolute; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 560px; max-height: 94%; overflow-y: auto; background: var(--bg); border-radius: 16px 16px 0 0;
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 18px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field > label, .field > .lab { font-weight: 700; font-size: 14px; }
.field em { font-style: normal; font-weight: 500; font-size: 12px; color: var(--muted); margin-left: 6px; }
input[type="text"], input[type="number"], input[type="date"], textarea {
  width: 100%; min-height: 46px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; }
textarea { min-height: 76px; resize: vertical; }
.drop { flex: 1 1 140px; min-height: 120px; border: 1.5px dashed var(--line); border-radius: 12px; background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--muted); }
.drop:active { background: var(--surface2); }
/* 사진·파일 버튼: 라벨 안의 투명한 입력칸이 직접 탭을 받는다 */
label.drop, label.btn { position: relative; overflow: hidden; cursor: pointer; }
label.btn { display: flex; align-items: center; justify-content: center; }
.fin { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 0; }
.card .ph { position: relative; }
.cnt { position: absolute; right: 6px; bottom: 6px; background: rgba(0,0,0,.62); color: #fff; font-size: 11px; padding: 1px 7px; border-radius: 999px; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.pthumb { position: relative; aspect-ratio: 3 / 4; border-radius: 10px; overflow: hidden; background: var(--surface2); border: 1px solid var(--line); }
.pthumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pthumb .cov, .pthumb .mk { position: absolute; left: 6px; bottom: 6px; font-size: 12px; padding: 3px 8px; border-radius: 999px; font-weight: 700; }
.pthumb .cov { background: var(--accent); color: var(--on-accent); }
.pthumb .mk { background: rgba(0,0,0,.62); color: #fff; min-height: 28px; }
.pthumb .rm { position: absolute; right: 4px; top: 4px; width: 32px; height: 32px; border-radius: 50%; background: rgba(0,0,0,.62); color: #fff; font-size: 18px; line-height: 1; display: grid; place-items: center; }
.preview { width: 100%; max-height: 300px; background: var(--surface2); border-radius: 12px; overflow: hidden; display: grid; place-items: center; }
.preview img { max-width: 100%; max-height: 300px; display: block; }
.err { color: var(--danger); font-size: 13px; }
.kv { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 6px 10px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }

/* 비교 */
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.pair figure { margin: 0; }
.pair .ph { aspect-ratio: 3 / 4; background: var(--surface2); border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
.pair img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pair figcaption { font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 700; }
.pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; }
.pick { position: relative; aspect-ratio: 3 / 4; border-radius: 10px; overflow: hidden; border: 2px solid transparent; background: var(--surface2); }
.pick img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pick[aria-pressed="true"] { border-color: var(--accent); }
.pick .ck { position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: none; place-items: center; font-size: 13px; font-weight: 700; }
.pick[aria-pressed="true"] .ck { display: grid; }
.decide { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.decide button { min-height: 52px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; }
.decide button[aria-pressed="true"].buy { background: var(--buy); color: var(--on-accent); border-color: var(--buy); }
.decide button[aria-pressed="true"].hold { background: var(--hold); color: #fff; border-color: var(--hold); }
.decide button[aria-pressed="true"].skip { background: var(--skip); color: #fff; border-color: var(--skip); }
.pill { display: inline-block; padding: 1px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1.5px solid currentColor; }
.match { border: 1.5px solid var(--accent); border-radius: 12px; padding: 12px; background: var(--surface); display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.match.none { border-color: var(--line); }
.match > span { font-size: 13px; color: var(--muted); }
.match .btn { flex: 0 0 auto; }
.aimatch { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 10px; width: 100%; align-items: start; font-size: 14px; }
.aimatch .th { aspect-ratio: 3 / 4; border-radius: 8px; overflow: hidden; background: var(--surface2); }
.aimatch .th img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pill.lvl { color: var(--accent); }
.score { border: 1.5px solid var(--accent); border-radius: 12px; padding: 12px; background: var(--surface); display: flex; flex-direction: column; gap: 8px; }
.score p { margin: 0; font-size: 14px; overflow-wrap: anywhere; }
.score .pct { font-size: 32px; font-weight: 700; color: var(--accent); line-height: 1; }
.score.hi { border-color: var(--hold); }
.score.hi .pct { color: var(--hold); }
.parts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.parts div { background: var(--surface2); border-radius: 8px; padding: 8px 6px; text-align: center; display: flex; flex-direction: column; gap: 2px; }
.parts span { font-size: 12px; color: var(--muted); }
.parts b { font-size: 16px; }
.range { width: 100%; accent-color: var(--accent); min-height: 44px; }
.bar { height: 10px; border-radius: 999px; background: var(--surface2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.score.hi .bar i { background: var(--hold); }
.pill.buy { color: var(--buy); } .pill.hold { color: var(--hold); } .pill.skip { color: var(--skip); }

/* 기록 */
.rec { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
.rec .th { width: 64px; aspect-ratio: 3 / 4; border-radius: 8px; overflow: hidden; background: var(--surface2); }
.rec .th img { width: 100%; height: 100%; object-fit: cover; display: block; }
.rec .mini { display: flex; gap: 4px; margin-top: 6px; }
.rec .mini img { width: 28px; height: 36px; object-fit: cover; border-radius: 4px; }
.rec p.memo { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }

/* 하단 탭 */
#nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
#nav .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
#nav button { min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--muted); font-size: 12px; }
#nav button[aria-current="page"] { color: var(--accent); font-weight: 700; }
#toast { position: fixed; z-index: 40; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: no-preference) { .panel { animation: up .18s ease-out; } @keyframes up { from { transform: translate(-50%, 24px); opacity: .6; } } }
</style>
</head>
<body>
<div id="app">
  <main id="view" aria-live="polite"></main>
</div>
<nav id="nav" aria-label="주 메뉴"></nav>
<div id="sheet" hidden></div>
<div id="toast" role="status" hidden></div>

<script>
(function () {
  'use strict';
  var KINDS = {
    '의류': ['코트','점퍼','재킷','베스트','가디건','티셔츠','블라우스','셔츠','니트·스웨터','원피스','바지','치마','세트·정장','운동복','잠옷·홈웨어','속옷·이너웨어','패션 소품','기타'],
    '신발': ['운동화·스니커즈','단화·로퍼','구두·힐','부츠','샌들·슬리퍼','기능성 신발','기타']
  };
  var SEASONS = ['봄·가을','여름','겨울','사계절'];
  var DECISIONS = [['구매','buy'],['보류','hold'],['미구매','skip']];
  var ICON = {
    home: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
    closet: '<path d="M12 8V6.6a2.1 2.1 0 1 1 2.1 2.1M12 8l9 6.6a1 1 0 0 1-.6 1.8H3.6a1 1 0 0 1-.6-1.8z"/>',
    compare: '<rect x="3" y="5" width="7.5" height="14" rx="1.2"/><rect x="13.5" y="5" width="7.5" height="14" rx="1.2"/>',
    log: '<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',
    gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>',
    cam: '<path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.2"/>',
    img: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/>'
  };
  function ic(n) { return '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">' + ICON[n] + '</svg>'; }
  function $(s) { return document.querySelector(s); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function uid() { try { return crypto.randomUUID(); } catch (e) { return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); } }

  /* ---------- 저장소: 휴대전화 브라우저 내부 DB(IndexedDB) ---------- */
  var idb = null;
  function openDB() {
    return new Promise(function (res, rej) {
      try {
        var r = indexedDB.open('closetcheck', 1);
        r.onupgradeneeded = function () { var d = r.result; d.createObjectStore('items', { keyPath: 'id' }); d.createObjectStore('decisions', { keyPath: 'id' }); };
        r.onsuccess = function () { res(r.result); };
        r.onerror = function () { rej(r.error); };
        r.onblocked = function () { rej(new Error('blocked')); };
      } catch (e) { rej(e); }
    });
  }
  function dbAll(store) {
    return new Promise(function (res, rej) {
      var q = idb.transaction(store).objectStore(store).getAll();
      q.onsuccess = function () { res(q.result || []); };
      q.onerror = function () { rej(q.error); };
    });
  }
  function dbPut(store, obj) {
    if (!idb) return Promise.resolve();
    return new Promise(function (res, rej) {
      var t = idb.transaction(store, 'readwrite'); t.objectStore(store).put(obj);
      t.oncomplete = function () { res(); }; t.onerror = function () { rej(t.error); }; t.onabort = function () { rej(t.error); };
    });
  }
  function dbDel(store, id) {
    if (!idb) return Promise.resolve();
    return new Promise(function (res, rej) {
      var t = idb.transaction(store, 'readwrite'); t.objectStore(store).delete(id);
      t.oncomplete = function () { res(); }; t.onerror = function () { rej(t.error); };
    });
  }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  /* 상품은 photos(여러 장)만 저장하고, photo(대표)는 화면용으로 첫 장을 가리킨다 */
  function toStore(it) { var o = Object.assign({}, it); delete o.photo; return o; }
  function normItem(i) { if (!i.photos || !i.photos.length) i.photos = i.photo ? [i.photo] : []; i.photo = i.photos[0]; return i; }

  /* ---------- 상태 ---------- */
  var MAXP = 8;
  function newCmp() { return { cand: null, ckind: '의류', csub: '', all: false, find: null, res: {}, cs: 'idle', cmsg: '', sel: [], kind: '전체', focus: 0, angle: 0, decision: '', name: '', price: '', memo: '', err: '' }; }
  function newForm() { return { id: '', createdAt: 0, photos: [], kind: '의류', sub: '', name: '', seasons: [], price: '', date: '', err: '' }; }
  var S = {
    ready: false, tab: 'home', items: [], decisions: [], storage: 'idb', persisted: null, installEvt: null, standalone: false,
    thr: Math.max(50, Math.min(95, Number(lsGet('cc_thr')) || 80)),
    closet: { kind: '전체', sub: '전체' }, cmp: newCmp(), rec: { filter: '전체' },
    form: newForm(), detailId: '', confirmDel: false, delRec: '', pickTarget: 'form', importMsg: ''
  };
  var urls = new WeakMap();
  function u(b) { if (!b) return ''; var x = urls.get(b); if (!x) { x = URL.createObjectURL(b); urls.set(b, x); } return x; }

    return featuresOf(candBlob).then(function (fc) {
      return Promise.all(item.photos.map(featuresOf)).then(function (fs) {
        var best = null;
        fs.forEach(function (f, k) { var r = compareFeat(fc, f); r.angle = k; if (!best || r.percent > best.percent) best = r; });
        return best;
      });
    });
  }
  function explain(r, kindWord) {
    var same = [], diff = [];
    (r.color >= 75 ? same : r.color < 50 ? diff : []).push(r.color >= 75 ? '색상' : '색상' + (Math.abs(r.dL) > 12 ? (r.dL > 0 ? '(후보가 더 밝음)' : '(후보가 더 어두움)') : ''));
    (r.shape >= 70 ? same : r.shape < 45 ? diff : []).push(r.shape >= 70 ? '모양' : '모양' + (r.longer > 0.08 ? '(후보가 더 길쭉함)' : r.longer < -0.08 ? '(후보가 더 짧고 넓음)' : ''));
    (r.texture >= 75 ? same : r.texture < 50 ? diff : []).push('무늬·질감');
    return { same: same.join(', '), diff: diff.join(', ') };
  }


  function sameType(c) { return c.csub ? S.items.filter(function (i) { return i.kind === c.ckind && i.sub === c.csub; }) : []; }
  function levelOf(p, nn) { var T = S.thr; return p >= T ? '같은 ' + nn : p >= T - 25 ? '비슷한 ' + nn : p >= T - 50 ? '조금 다른 ' + nn : '다른 ' + nn; }

  function findBlock(c, owned) {
    if (!c.cand) return '';
    var f = c.find || { state: 'idle' };
    var nn = c.ckind === '신발' ? '신발' : '옷', ct = c.ckind === '신발' ? '켤레' : '벌', pr = c.ckind === '신발' ? '를' : '을';
    if (f.state === 'loading') return '<div class="match"><b>내 옷장에서 비슷한 ' + nn + ' 찾는 중…</b></div>';
    var head = '';
    if (f.state === 'done') {
      var rows = f.top.map(function (x) {
        var it = itemById(x.id); if (!it) return '';
        return '<div class="aimatch"><div class="th">' + thumb(it.photo, it.name || it.sub) + '</div><div style="min-width:0"><span class="pill lvl">' + esc(levelOf(x.percent, nn)) + '</span> <b class="num">' + x.percent + '%</b><p style="margin-top:4px;overflow-wrap:anywhere">' + esc(it.name || it.sub) + '</p></div></div>';
      }).join('');
      var hits = f.top.filter(function (x) { return x.percent >= S.thr - 25; }).length;
      head = '<div class="match' + (hits ? '' : ' none') + '"><b>' + (hits ? '비슷한 ' + nn + ' ' + hits + ct + pr + ' 찾았습니다' : '겹치는 ' + nn + '을 찾지 못했습니다') + '</b>' + rows + '<span>가장 가까운 ' + nn + ' 순서입니다.</span></div>';
    } else if (f.state === 'err') {
      head = '<p class="err" role="alert">' + esc(f.msg) + '</p>';
    }
    var can = c.csub && owned.length;
    return head + '<button class="btn" data-act="find"' + (can ? '' : ' disabled') + '>' + (f.state === 'done' ? '다시 찾기' : '비슷한 ' + nn + ' 찾기') + '</button><p class="muted" style="font-size:12px">' +
      (c.csub ? (owned.length ? '같은 종류 중에서 색, 모양, 무늬가 가까운 ' + nn + '을 찾습니다.' : '비교할 같은 종류가 내 옷장에 없습니다.') : '후보의 세부 종류를 먼저 선택해 주세요.') + '</p>';
  }

  function scoreBlock(c, sel, cur) {
    var r = c.res[cur.id], h = '', nn = c.ckind === '신발' ? '신발' : '옷';
    if (c.cs === 'loading') return '<div class="match"><b>사진을 비교하는 중…</b></div>';
    if (c.cs === 'err') h += '<p class="err" role="alert">' + esc(c.cmsg) + '</p>';
    if (r) {
      var hi = r.percent >= S.thr, ex = explain(r);
      h += '<div class="score' + (hi ? ' hi' : '') + '"><div class="between"><b>' + esc(cur.name || cur.sub) + ' 일치도</b><span class="pct num">' + r.percent + '%</span></div>' +
        '<div class="bar" role="meter" aria-label="일치도" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + r.percent + '"><i style="width:' + r.percent + '%"></i></div>' +
        '<p><b>' + esc(levelOf(r.percent, nn)) + '</b>' + (hi ? ' · 중복 구매 가능성이 높습니다' : '') + '</p>' +
        '<div class="parts"><div><span>색상</span><b class="num">' + r.color + '%</b></div><div><span>모양</span><b class="num">' + r.shape + '%</b></div><div><span>무늬·질감</span><b class="num">' + r.texture + '%</b></div></div>' +
        (ex.same ? '<p class="muted">비슷한 점: ' + esc(ex.same) + '</p>' : '') + (ex.diff ? '<p class="muted">다른 점: ' + esc(ex.diff) + '</p>' : '') +
        (cur.photos.length > 1 && r.angle > 0 ? '<p class="muted">사진 ' + (r.angle + 1) + '(각도)가 가장 비슷해서 그 사진으로 계산했습니다.</p>' : '') +
        (r.reliable ? '' : '<p class="err">배경이 복잡하거나 옷이 잘 구분되지 않아 모양 비교의 정확도가 낮습니다. 단색 배경에서 다시 찍어 보세요.</p>') +
        '<p class="muted" style="font-size:12px">사진의 색, 모양, 무늬를 계산한 값입니다. 소재, 질감, 단추·칼라 같은 디테일은 비교하지 못하니 나란히 놓고 함께 확인하세요.</p></div>';
    }
    return h + '<button class="btn primary" data-act="cmp-score">' + (Object.keys(c.res).length ? '다시 비교하기' : '비교하기') + (sel.length > 1 ? ' (선택한 ' + sel.length + (c.ckind === '신발' ? '켤레' : '벌') + ')' : '') + '</button>';
  }

  function cmpScore() {
    var c = S.cmp;
    if (!c.cand || !c.sel.length) return;
    var items = c.sel.map(itemById).filter(Boolean);
    if (!items.length) return;
    c.cs = 'loading'; c.cmsg = ''; render();
    Promise.all(items.map(function (it) { return scoreItem(c.cand, it).then(function (r) { return [it.id, r]; }); }))
      .then(function (rs) { if (S.cmp !== c) return; rs.forEach(function (x) { c.res[x[0]] = x[1]; }); c.cs = 'done'; render(); })
      .catch(function () { if (S.cmp !== c) return; c.cs = 'err'; c.cmsg = '사진을 분석하지 못했습니다. 다른 사진으로 시도해 주세요.'; render(); });
  }

  function findSimilar() {
    var c = S.cmp, owned = sameType(c);
    if (!c.cand || !owned.length) return;
    c.find = { state: 'loading' }; render();
    Promise.all(owned.map(function (it) { return scoreItem(c.cand, it).then(function (r) { return { id: it.id, r: r }; }); }))
      .then(function (rs) {
        if (S.cmp !== c) return;
        rs.forEach(function (x) { c.res[x.id] = x.r; });
        rs.sort(function (a, b) { return b.r.percent - a.r.percent; });
        c.find = { state: 'done', top: rs.slice(0, 3).map(function (x) { return { id: x.id, percent: x.r.percent }; }) };
        var hits = rs.filter(function (x) { return x.r.percent >= S.thr - 25; }).slice(0, 8).map(function (x) { return x.id; });
        if (hits.length) { c.sel = hits; c.focus = 0; c.angle = 0; }
        c.cs = 'done'; render();
      })
      .catch(function () { if (S.cmp !== c) return; c.find = { state: 'err', msg: '사진을 분석하지 못했습니다. 다른 사진으로 시도해 주세요.' }; render(); });
  }

  function viewCompare() {
    var c = S.cmp, owned = sameType(c);
    var pool = (c.csub && !c.all) ? owned : S.items.filter(function (i) { return c.kind === '전체' || i.kind === c.kind; });
    var sel = c.sel.map(itemById).filter(Boolean);
    var focus = Math.min(c.focus, Math.max(0, sel.length - 1));
    var candBlock = c.cand ?
      '<div class="preview"><img src="' + u(c.cand) + '" alt="구매 후보 사진"></div><div class="row">' + pickBtn('cmp', 'gal', 'img', '다른 사진', 'btn') + '<button class="btn" data-act="cmp-remove-cand">사진 지우기</button></div>' :
      '<div class="row">' + pickBtn('cmp', 'gal', 'img', '사진 불러오기', 'drop') + pickBtn('cmp', 'cam', 'cam', '사진 촬영', 'drop') + '</div>';
    var typeBlock = c.cand ? '<div class="field"><div class="lab">후보 종류<em>필수</em></div>' + seg('후보 상품 구분', ['의류', '신발'], c.ckind, 'cmp-ckind') +
      '<div class="chips" role="radiogroup" aria-label="후보 세부 종류">' + KINDS[c.ckind].map(function (s) {
        return '<button class="chip" role="radio" data-act="cmp-csub" data-v="' + s + '" aria-checked="' + (c.csub === s) + '">' + s + '</button>';
      }).join('') + '</div></div>' : '';
    var notice = '';
    if (c.csub) {
      notice = owned.length ?
        '<div class="match"><b>같은 종류(' + esc(c.csub) + ')를 ' + owned.length + (c.ckind === '신발' ? '켤레' : '벌') + ' 갖고 있습니다</b><span>구매 전에 겹치지 않는지 비교해 보세요.</span>' + (owned.length > 1 ? '<button class="btn" data-act="cmp-select-same">같은 종류 모두 선택</button>' : '') + '</div>' :
        '<div class="match none"><b>같은 종류(' + esc(c.csub) + ')는 아직 없습니다</b><span>내 옷장에 없는 종류입니다.</span></div>';
    }
    var scope = c.csub ? '<button class="ghost" style="font-size:13px" data-act="' + (c.all ? 'cmp-same' : 'cmp-all') + '">' + (c.all ? '같은 종류만 보기' : '다른 종류에서도 고르기') + '</button>' : '';
    var picker = S.items.length ? ((c.csub && !c.all ? '' : seg('상품 구분', ['전체', '의류', '신발'], c.kind, 'cmp-kind')) + (pool.length ? '<div class="pick-grid">' + pool.map(function (i) {
      var on = c.sel.indexOf(i.id) >= 0;
      return '<button class="pick" data-act="cmp-toggle" data-id="' + i.id + '" aria-pressed="' + on + '" aria-label="' + esc((i.name || i.sub) + ' 선택') + '">' + thumb(i.photo, i.name || i.sub) + '<span class="ck">✓</span></button>';
    }).join('') + '</div>' : '<p class="muted">비교할 상품이 없습니다.</p>') + scope) :
      '<div class="empty"><p>비교할 내 옷이 아직 없습니다. 먼저 등록하면 나란히 볼 수 있습니다.</p><button class="btn" data-act="open-register">상품 등록</button></div>';
    var pair = '';
    if (c.cand && sel.length) {
      var cur = sel[focus]; var ang = Math.min(c.angle || 0, cur.photos.length - 1);
      pair = '<section class="field"><div class="lab">나란히 보기</div><div class="pair"><figure><figcaption>구매 후보</figcaption><div class="ph">' + thumb(c.cand, '구매 후보') + '</div></figure>' +
        '<figure><figcaption>내 옷장 · ' + esc(cur.sub) + '</figcaption><div class="ph">' + thumb(cur.photos[ang], cur.name || cur.sub) + '</div></figure></div>' +
        (cur.photos.length > 1 ? '<div class="chips" role="group" aria-label="사진 각도">' + cur.photos.map(function (p, k) { return '<button class="chip" data-act="cmp-angle" data-v="' + k + '" aria-pressed="' + (k === ang) + '">각도 ' + (k + 1) + '</button>'; }).join('') + '</div>' : '') +
        (sel.length > 1 ? '<div class="chips">' + sel.map(function (s, i) { return '<button class="chip" data-act="cmp-focus" data-v="' + i + '" aria-pressed="' + (i === focus) + '">' + esc(s.name || s.sub) + (c.res[s.id] ? ' · ' + c.res[s.id].percent + '%' : '') + '</button>'; }).join('') + '</div>' : '') +
        '<p class="muted" style="font-size:13px">' + esc(cur.kind + ' · ' + cur.sub + ' · ' + cur.seasons.join(', ') + (cur.date ? ' · 구매 ' + cur.date : '')) + '</p>' + scoreBlock(c, sel, cur) + '</section>';
    }
    var dec = '<div class="decide" role="group" aria-label="결정">' + DECISIONS.map(function (d) {
      return '<button class="' + d[1] + '" data-act="cmp-decide" data-v="' + d[0] + '" aria-pressed="' + (c.decision === d[0]) + '">' + d[0] + '</button>';
    }).join('') + '</div>';
    return '<div class="stack"><div class="top"><div><h2>구매 비교</h2><p class="tag">후보 사진을 내 옷과 나란히 놓고 결정하세요</p></div></div>' +
      '<section class="field"><div class="lab">① 구매 후보 사진 <em>필수</em></div>' + candBlock + typeBlock + '</section>' +
      '<section class="field"><div class="lab">② 내 옷과 비교 <em>여러 개 선택 가능</em></div>' + (c.cand ? notice + findBlock(c, owned) + picker : '<p class="muted" style="font-size:13px">후보 사진을 불러오면 같은 종류의 내 옷을 찾아 비교할 수 있습니다. 쇼핑몰 상품 사진을 저장하거나 캡처해 두세요.</p>') + '</section>' + pair +
      '<section class="field"><div class="lab">③ 결정 기록</div>' + dec +
      '<input type="text" id="cmpName" data-bind="cmp.name" placeholder="상품명 (선택)" value="' + esc(c.name) + '" aria-label="상품명">' +
      '<input type="number" inputmode="numeric" min="0" id="cmpPrice" data-bind="cmp.price" placeholder="가격 (선택, 원)" value="' + esc(c.price) + '" aria-label="가격">' +
      '<textarea id="cmpMemo" data-bind="cmp.memo" placeholder="메모 (선택)" aria-label="메모">' + esc(c.memo) + '</textarea>' +
      (c.err ? '<p class="err" role="alert">' + esc(c.err) + '</p>' : '') +
      '<button class="btn primary" data-act="cmp-save">소비기록에 저장</button></section></div>';
  }

  function viewLog() {
    var f = S.rec.filter, now = new Date();
    var month = S.decisions.filter(function (d) { var x = new Date(d.createdAt); return x.getFullYear() === now.getFullYear() && x.getMonth() === now.getMonth(); });
    function cnt(arr, name) { return arr.filter(function (d) { return d.decision === name; }).length; }
    var buySum = S.decisions.reduce(function (a, d) { return a + (d.decision === '구매' && d.price ? d.price : 0); }, 0);
    var list = S.decisions.filter(function (d) { return f === '전체' || d.decision === f; });
    var stats = '<section class="panel-box stack" style="gap:12px"><div class="counts">' + DECISIONS.map(function (d) {
      return '<div class="count"><b class="num" style="color:var(--' + d[1] + ')">' + cnt(S.decisions, d[0]) + '</b><span>' + d[0] + ' · 이번 달 ' + cnt(month, d[0]) + '</span></div>';
    }).join('') + '</div>' +
      (buySum ? '<p class="muted" style="font-size:13px">구매로 기록한 금액 합계 <b class="num" style="color:var(--ink)">' + won(buySum) + '</b></p>' : '') +
      '<p class="muted" style="font-size:12px">보류·미구매 금액은 절약액으로 계산하지 않습니다.</p></section>';
    var rows = list.length ? list.map(function (d) {
      var minis = (d.compareIds || []).map(itemById).filter(Boolean).slice(0, 4).map(function (i) { return thumb(i.photo, i.name || i.sub); }).join('');
      var cls = DECISIONS.filter(function (x) { return x[0] === d.decision; })[0][1];
      return '<article class="rec"><div class="th">' + thumb(d.photo, d.name || '구매 후보') + '</div><div style="min-width:0"><div class="between"><span class="pill ' + cls + '">' + d.decision + '</span><span class="muted num" style="font-size:12px">' + fmtDate(d.createdAt) + '</span></div>' +
        '<p style="font-weight:500;margin-top:4px;overflow-wrap:anywhere">' + esc(d.name || '이름 없는 상품') + (d.csub ? ' <span class="muted" style="font-weight:400">· ' + esc(d.csub) + '</span>' : '') + (d.price ? ' <span class="muted num" style="font-weight:400">· ' + won(d.price) + '</span>' : '') + '</p>' +
        (d.memo ? '<p class="memo">' + esc(d.memo) + '</p>' : '') + (minis ? '<div class="mini" aria-label="비교한 내 옷">' + minis + '</div>' : '') +
        '<div style="margin-top:6px">' + (S.delRec === d.id ? '<button class="btn danger" style="min-height:36px;padding:4px 12px" data-act="rec-del-yes" data-id="' + d.id + '">정말 삭제</button> <button class="ghost" data-act="rec-del-no">취소</button>' : '<button class="ghost" style="min-height:36px;padding:0;font-size:13px" data-act="rec-del" data-id="' + d.id + '">삭제</button>') + '</div></div></article>';
    }).join('') : '<div class="empty"><h3>' + (S.decisions.length ? '해당하는 기록이 없습니다' : '아직 소비 기록이 없습니다') + '</h3><p>구매 비교에서 구매, 보류, 미구매를 선택해 저장하면 여기에 쌓입니다.</p></div>';
    return '<div class="stack"><div class="top"><div><h2>소비기록</h2><p class="tag">결정 내역과 소비 습관</p></div></div>' + stats + seg('결정 필터', ['전체', '구매', '보류', '미구매'], f, 'rec-filter') + '<div class="stack" style="gap:10px">' + rows + '</div></div>';
  }

  function render() {
    var v = $('#view');
    if (!S.ready) { v.innerHTML = '<p class="muted" style="padding:40px 0;text-align:center">불러오는 중…</p>'; }
    else v.innerHTML = ({ home: viewHome, closet: viewCloset, compare: viewCompare, log: viewLog })[S.tab]();
    var tabs = [['home', '홈', 'home'], ['closet', '내 옷장', 'closet'], ['compare', '구매 비교', 'compare'], ['log', '소비기록', 'log']];
    $('#nav').innerHTML = '<div class="in">' + tabs.map(function (t) {
      return '<button data-act="tab" data-v="' + t[0] + '"' + (S.tab === t[0] ? ' aria-current="page"' : '') + '>' + ic(t[2]) + '<span>' + t[1] + '</span></button>';
    }).join('') + '</div>';
  }

  /* ---------- 시트 ---------- */
  var sheetFn = null;
  function openSheet(fn) { sheetFn = fn; $('#sheet').hidden = false; document.body.style.overflow = 'hidden'; paintSheet(); }
  function paintSheet() {
    var el = $('#sheet'); if (!sheetFn) return;
    var p = el.querySelector('.panel'), top = p ? p.scrollTop : 0;
    el.innerHTML = '<div class="scrim" data-act="close-sheet"></div><div class="panel" role="dialog" aria-modal="true">' + sheetFn() + '</div>';
    var np = el.querySelector('.panel'); if (np) np.scrollTop = top;
  }
  function closeSheet() { sheetFn = null; var el = $('#sheet'); el.hidden = true; el.innerHTML = ''; document.body.style.overflow = ''; S.confirmDel = false; }

  function sheetForm() {
    var f = S.form;
    var photo = f.photos.length ?
      '<div class="pgrid">' + f.photos.map(function (b, i) {
        return '<div class="pthumb"><img src="' + u(b) + '" alt="사진 ' + (i + 1) + '">' +
          (i === 0 ? '<span class="cov">대표</span>' : '<button class="mk" data-act="form-cover" data-i="' + i + '">대표로</button>') +
          '<button class="rm" data-act="form-photo-del" data-i="' + i + '" aria-label="사진 ' + (i + 1) + ' 삭제">×</button></div>';
      }).join('') + '</div><p class="muted num" style="font-size:12px">' + f.photos.length + ' / ' + MAXP + '장 · 정면, 뒷면, 라벨, 디테일 등 여러 각도를 올려 두면 비교할 때 편합니다.</p>' +
      (f.photos.length < MAXP ? '<div class="row">' + pickBtn('form', 'cam', 'cam', '촬영해서 추가', 'btn') + pickBtn('form', 'gal', 'img', '갤러리에서 추가', 'btn', true) + '</div>' : '') :
      '<div class="row">' + pickBtn('form', 'cam', 'cam', '사진 촬영', 'drop') + pickBtn('form', 'gal', 'img', '갤러리에서 선택 (여러 장 가능)', 'drop', true) + '</div>';
    return '<div class="sheet-head"><h2>' + (f.id ? '상품 수정' : '상품 등록') + '</h2><button class="ghost" data-act="close-sheet">닫기</button></div>' +
      '<div class="field"><div class="lab">상품 사진<em>필수 · 여러 각도 가능</em></div>' + photo + '</div>' +
      '<div class="field"><div class="lab">상품 구분<em>필수</em></div>' + seg('상품 구분', ['의류', '신발'], f.kind, 'form-kind') + '</div>' +
      '<div class="field"><div class="lab">세부 종류<em>필수</em></div><div class="chips" role="radiogroup" aria-label="세부 종류">' + KINDS[f.kind].map(function (s) {
        return '<button class="chip" role="radio" data-act="form-sub" data-v="' + s + '" aria-checked="' + (f.sub === s) + '">' + s + '</button>';
      }).join('') + '</div></div>' +
      '<div class="field"><div class="lab">계절<em>필수 · 여러 개 선택 가능</em></div><div class="chips">' + SEASONS.map(function (s) {
        return '<button class="chip" data-act="form-season" data-v="' + s + '" aria-pressed="' + (f.seasons.indexOf(s) >= 0) + '">' + s + '</button>';
      }).join('') + '</div></div>' +
      '<div class="field"><label for="fName">상품명<em>선택</em></label><input type="text" id="fName" data-bind="form.name" value="' + esc(f.name) + '" placeholder="예: 검정 울 코트"></div>' +
      '<div class="field"><label for="fPrice">구매 가격<em>선택</em></label><input type="number" inputmode="numeric" min="0" id="fPrice" data-bind="form.price" value="' + esc(f.price) + '" placeholder="원"></div>' +
      '<div class="field"><label for="fDate">구매일<em>선택</em></label><input type="date" id="fDate" data-bind="form.date" value="' + esc(f.date) + '"></div>' +
      (f.err ? '<p class="err" role="alert">' + esc(f.err) + '</p>' : '') +
      '<button class="btn primary" data-act="form-save">' + (f.id ? '수정 저장' : '내 옷장에 등록') + '</button>';
  }
  function sheetDetail() {
    var it = itemById(S.detailId); if (!it) return '<div class="sheet-head"><h2>상품</h2><button class="ghost" data-act="close-sheet">닫기</button></div><p class="muted">상품을 찾을 수 없습니다.</p>';
    return '<div class="sheet-head"><h2>' + esc(it.name || it.sub) + '</h2><button class="ghost" data-act="close-sheet">닫기</button></div>' +
      '<div class="preview"><img src="' + u(it.photos[Math.min(S.detailPhoto || 0, it.photos.length - 1)]) + '" alt="' + esc(it.name || it.sub) + '"></div>' +
      (it.photos.length > 1 ? '<div class="chips" role="group" aria-label="사진 각도">' + it.photos.map(function (p, k) { return '<button class="chip" data-act="detail-photo" data-i="' + k + '" aria-pressed="' + (k === Math.min(S.detailPhoto || 0, it.photos.length - 1)) + '">' + (k === 0 ? '대표' : '사진 ' + (k + 1)) + '</button>'; }).join('') + '</div>' : '') +
      '<dl class="kv"><dt>구분</dt><dd>' + it.kind + ' · ' + esc(it.sub) + '</dd><dt>계절</dt><dd>' + esc(it.seasons.join(', ')) + '</dd>' +
      (it.price != null && it.price !== '' ? '<dt>구매 가격</dt><dd class="num">' + won(it.price) + '</dd>' : '') + (it.date ? '<dt>구매일</dt><dd class="num">' + it.date + '</dd>' : '') + '<dt>등록일</dt><dd class="num">' + fmtDate(it.createdAt) + '</dd></dl>' +
      '<div class="row"><button class="btn" data-act="edit-item">수정</button>' + (S.confirmDel ? '<button class="btn danger" data-act="del-item-yes">정말 삭제</button>' : '<button class="btn danger" data-act="del-item">삭제</button>') + '</div>';
  }
  function sheetSettings() {
    var last = lsGet('cc_lastBackup');
    var store = S.storage === 'mem' ? '<span style="color:var(--hold)">임시 저장 (창을 닫으면 사라짐)</span>' : '휴대전화 안에 저장 중' + (S.persisted ? ' · 자동 삭제 방지 켜짐' : '');
    var inst = S.standalone ? '<p class="muted" style="font-size:13px">앱으로 실행 중입니다.</p>' :
      (S.installEvt ? '<button class="btn primary" data-act="install">홈 화면에 설치</button>' : '<p class="muted" style="font-size:13px">Chrome 메뉴(⋮)에서 <b>앱 설치</b> 또는 <b>홈 화면에 추가</b>를 누르면 앱처럼 설치됩니다.</p>');
    return '<div class="sheet-head"><h2>설정과 백업</h2><button class="ghost" data-act="close-sheet">닫기</button></div>' +
      '<div class="panel-box stack" style="gap:8px"><dl class="kv"><dt>저장 위치</dt><dd>' + store + '</dd><dt>등록 상품</dt><dd class="num">' + S.items.length + '개</dd><dt>소비기록</dt><dd class="num">' + S.decisions.length + '건</dd><dt>마지막 백업</dt><dd>' + (last ? esc(last) : '아직 없음') + '</dd></dl></div>' +
      '<div class="field"><div class="lab">같은 옷으로 볼 기준 <span class="num" id="thrVal" style="color:var(--accent)">' + S.thr + '%</span></div><input class="range" type="range" id="thrRange" min="50" max="95" step="5" value="' + S.thr + '" aria-label="같은 옷으로 볼 일치도 기준">' +
      '<p class="muted" style="font-size:13px">일치도가 이 값 이상이면 같은 옷(신발)으로 표시합니다. 같은 옷인데 낮게 나오면 기준을 낮추고, 다른 옷인데 높게 나오면 올려 보세요.</p></div>' +
      '<div class="field"><div class="lab">앱으로 설치</div>' + inst + '</div>' +
      '<div class="field"><div class="lab">백업 파일 저장</div><p class="muted" style="font-size:13px">사진과 기록을 파일 하나로 저장합니다. 앱 데이터를 지우거나 휴대전화를 바꾸기 전에 저장해 두세요.</p><button class="btn primary" data-act="export">백업 파일 저장</button></div>' +
      '<div class="field"><div class="lab">백업 파일 불러오기</div><p class="muted" style="font-size:13px">저장해 둔 파일을 선택하면 현재 데이터에 없는 항목만 추가합니다. 기존 데이터는 지우지 않습니다.</p><label class="btn">백업 파일 선택<input class="fin" type="file" accept=".json,application/json" data-target="import" aria-label="백업 파일 선택"></label>' + (S.importMsg ? '<p role="status" style="font-size:14px">' + esc(S.importMsg) + '</p>' : '') + '</div>';
  }

  /* ---------- 백업 ---------- */
  function b2d(b) { return new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(r.result); }; r.onerror = function () { rej(r.error); }; r.readAsDataURL(b); }); }
  function d2b(s) {
    var p = s.split(','), m = /data:(.*?);base64/.exec(p[0]), bin = atob(p[1]), a = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return new Blob([a], { type: m ? m[1] : 'image/jpeg' });
  }
  function saveFile(name, text) {
    function viaAnchor() {
      var blob = new Blob([text], { type: 'application/json' }), url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = name; document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
      return Promise.resolve();
    }
    try {
      var C = window.Capacitor;
      if (C && C.isNativePlatform && C.isNativePlatform()) {
        var FS = C.registerPlugin('Filesystem'), SH = C.registerPlugin('Share');
        return FS.writeFile({ path: name, data: text, directory: 'CACHE', encoding: 'utf8' }).then(function (r) {
          return SH.share({ title: name, dialogTitle: '백업 파일 저장·보내기', url: r.uri });
        }).catch(function (e) { if (e && /cancel/i.test(String(e.message || e))) throw { code: 'declined' }; throw e; });
      }
    } catch (e) {}
    try {
      if (window.claude && window.claude.use) return window.claude.use('downloads').then(function (d) { return d ? d.save({ filename: name, data: text }) : viaAnchor(); }, viaAnchor);
    } catch (e) {}
    return viaAnchor();
  }
  function doExport() {
    toast('백업 파일을 만드는 중…');
    Promise.all(S.items.map(function (i) { return Promise.all(i.photos.map(b2d)).then(function (ds) { var o = Object.assign({}, i, { photos: ds }); delete o.photo; return o; }); }))
      .then(function (items) {
        return Promise.all(S.decisions.map(function (x) { return b2d(x.photo).then(function (d) { return Object.assign({}, x, { photo: d }); }); })).then(function (decs) {
          var data = JSON.stringify({ app: '옷장체크', version: 1, exportedAt: new Date().toISOString(), items: items, decisions: decs });
          var t = new Date(), name = '옷장체크-백업-' + t.getFullYear() + String(t.getMonth() + 1).padStart(2, '0') + String(t.getDate()).padStart(2, '0') + '.json';
          return saveFile(name, data);
        });
      })
      .then(function () { var t = new Date(); lsSet('cc_lastBackup', fmtDate(t.getTime())); toast('백업 파일을 저장했습니다.'); if (sheetFn) paintSheet(); })
      .catch(function (e) { toast(e && e.code === 'declined' ? '저장을 취소했습니다.' : '백업 파일을 저장하지 못했습니다.'); });
  }
  function doImport(file) {
    var r = new FileReader();
    r.onload = function () {
      try {
        var j = JSON.parse(r.result);
        if (!j || j.app !== '옷장체크' || !Array.isArray(j.items)) throw new Error('format');
        var addI = 0, addD = 0, jobs = [];
        j.items.forEach(function (i) {
          var arr = (i.photos && i.photos.length) ? i.photos : (i.photo ? [i.photo] : []);
          if (!itemById(i.id) && arr.length) { var o = Object.assign({}, i, { photos: arr.map(d2b) }); o.photo = o.photos[0]; S.items.push(o); jobs.push(dbPut('items', toStore(o))); addI++; }
        });
        (j.decisions || []).forEach(function (d) {
          if (!S.decisions.some(function (x) { return x.id === d.id; }) && d.photo) { var o = Object.assign({}, d, { photo: d2b(d.photo) }); S.decisions.push(o); jobs.push(dbPut('decisions', o)); addD++; }
        });
        S.items.sort(function (a, b) { return b.createdAt - a.createdAt; }); S.decisions.sort(function (a, b) { return b.createdAt - a.createdAt; });
        Promise.all(jobs).then(function () { S.importMsg = '상품 ' + addI + '개, 소비기록 ' + addD + '건을 추가했습니다.'; paintSheet(); render(); })
          .catch(function () { S.importMsg = '일부를 저장하지 못했습니다. 저장 공간을 확인해 주세요.'; paintSheet(); render(); });
      } catch (e) { S.importMsg = '옷장체크 백업 파일이 아닙니다.'; paintSheet(); }
    };
    r.readAsText(file);
  }

  /* ---------- 동작 ---------- */
  var tt;
  function toast(m) { var t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(function () { t.hidden = true; }, 2600); }
  function saveFail() { toast('저장하지 못했습니다. 휴대전화 저장 공간을 확인해 주세요.'); }

  function saveForm() {
    var f = S.form, miss = [];
    if (!f.photos.length) miss.push('사진'); if (!f.sub) miss.push('세부 종류'); if (!f.seasons.length) miss.push('계절');
    if (miss.length) { f.err = miss.join(', ') + '을(를) 입력해 주세요.'; paintSheet(); return; }
    var old = f.id ? itemById(f.id) : null;
    var it = { id: f.id || uid(), photos: f.photos.slice(), photo: f.photos[0], kind: f.kind, sub: f.sub, name: f.name.trim(), seasons: SEASONS.filter(function (s) { return f.seasons.indexOf(s) >= 0; }),
      price: f.price === '' ? null : Math.max(0, Number(f.price)), date: f.date || '', createdAt: old ? old.createdAt : Date.now() };
    dbPut('items', toStore(it)).then(function () {
      delete S.cmp.res[it.id]; S.cmp.find = null;
      if (old) S.items[S.items.indexOf(old)] = it; else S.items.unshift(it);
      closeSheet(); render(); toast(old ? '수정했습니다.' : '내 옷장에 등록했습니다.');
    }).catch(saveFail);
  }
  function saveCmp() {
    var c = S.cmp;
    if (!c.cand) { c.err = '구매 후보 사진을 먼저 불러와 주세요.'; render(); return; }
    if (!c.csub) { c.err = '후보의 상품 구분과 세부 종류를 선택해 주세요.'; render(); return; }
    if (!c.decision) { c.err = '구매, 보류, 미구매 중 하나를 선택해 주세요.'; render(); return; }
    var d = { id: uid(), photo: c.cand, compareIds: c.sel.slice(), ckind: c.ckind, csub: c.csub, decision: c.decision, name: c.name.trim(), price: c.price === '' ? null : Math.max(0, Number(c.price)), memo: c.memo.trim(), createdAt: Date.now() };
    dbPut('decisions', d).then(function () { S.decisions.unshift(d); S.cmp = newCmp(); render(); toast('소비기록에 저장했습니다.'); }).catch(saveFail);
  }

  var A = {
    'tab': function (t) { S.tab = t.dataset.v; render(); window.scrollTo(0, 0); },
    'open-register': function () { S.form = newForm(); openSheet(sheetForm); },
    'open-item': function (t) { S.detailId = t.dataset.id; S.detailPhoto = 0; S.confirmDel = false; openSheet(sheetDetail); },
    'detail-photo': function (t) { S.detailPhoto = Number(t.dataset.i); paintSheet(); },
    'form-cover': function (t) { var a = S.form.photos, i = Number(t.dataset.i), b = a.splice(i, 1)[0]; a.unshift(b); paintSheet(); },
    'form-photo-del': function (t) { S.form.photos.splice(Number(t.dataset.i), 1); paintSheet(); },
    'cmp-angle': function (t) { S.cmp.angle = Number(t.dataset.v); render(); },
    'edit-item': function () { var i = itemById(S.detailId); if (!i) return; S.form = { id: i.id, createdAt: i.createdAt, photos: i.photos.slice(), kind: i.kind, sub: i.sub, name: i.name || '', seasons: i.seasons.slice(), price: i.price == null ? '' : String(i.price), date: i.date || '', err: '' }; sheetFn = sheetForm; paintSheet(); },
    'del-item': function () { S.confirmDel = true; paintSheet(); },
    'del-item-yes': function () {
      var id = S.detailId; dbDel('items', id).then(function () {
        S.items = S.items.filter(function (i) { return i.id !== id; });
        S.cmp.sel = S.cmp.sel.filter(function (x) { return x !== id; }); closeSheet(); render(); toast('삭제했습니다.');
      }).catch(saveFail);
    },
    'close-sheet': function () { closeSheet(); },
    'open-settings': function () { S.importMsg = ''; openSheet(sheetSettings); },
    'export': doExport,
    'form-kind': function (t) { if (S.form.kind !== t.dataset.v) { S.form.kind = t.dataset.v; S.form.sub = ''; } paintSheet(); },
    'form-sub': function (t) { S.form.sub = t.dataset.v; paintSheet(); },
    'form-season': function (t) { var a = S.form.seasons, i = a.indexOf(t.dataset.v); if (i >= 0) a.splice(i, 1); else a.push(t.dataset.v); paintSheet(); },
    'form-save': saveForm,
    'closet-kind': function (t) { S.closet.kind = t.dataset.v; S.closet.sub = '전체'; render(); },
    'closet-sub': function (t) { S.closet.sub = t.dataset.v; render(); },
    'cmp-kind': function (t) { S.cmp.kind = t.dataset.v; render(); },
    'cmp-toggle': function (t) { var a = S.cmp.sel, i = a.indexOf(t.dataset.id); if (i >= 0) a.splice(i, 1); else a.push(t.dataset.id); S.cmp.focus = Math.max(0, a.length - 1); S.cmp.angle = 0; render(); },
    'cmp-focus': function (t) { S.cmp.focus = Number(t.dataset.v); S.cmp.angle = 0; render(); },
    'cmp-decide': function (t) { S.cmp.decision = t.dataset.v; S.cmp.err = ''; render(); },
    'cmp-remove-cand': function () { S.cmp.cand = null; S.cmp.find = null; S.cmp.res = {}; S.cmp.cs = 'idle'; render(); },
    'cmp-ckind': function (t) { if (S.cmp.ckind !== t.dataset.v) { S.cmp.ckind = t.dataset.v; S.cmp.csub = ''; S.cmp.all = false; S.cmp.find = null; } render(); },
    'cmp-csub': function (t) { S.cmp.csub = t.dataset.v; S.cmp.all = false; S.cmp.find = null; S.cmp.err = ''; render(); },
    'cmp-select-same': function () { S.cmp.sel = sameType(S.cmp).slice(0, 8).map(function (i) { return i.id; }); S.cmp.focus = 0; S.cmp.angle = 0; render(); },
    'cmp-all': function () { S.cmp.all = true; render(); },
    'cmp-same': function () { S.cmp.all = false; render(); },
    'find': findSimilar,
    'cmp-score': cmpScore,
    'install': function () { if (S.installEvt) { var e = S.installEvt; S.installEvt = null; e.prompt(); paintSheet(); } },
    'cmp-save': saveCmp,
    'rec-filter': function (t) { S.rec.filter = t.dataset.v; S.delRec = ''; render(); },
    'rec-del': function (t) { S.delRec = t.dataset.id; render(); },
    'rec-del-no': function () { S.delRec = ''; render(); },
    'rec-del-yes': function (t) { var id = t.dataset.id; dbDel('decisions', id).then(function () { S.decisions = S.decisions.filter(function (d) { return d.id !== id; }); S.delRec = ''; render(); toast('삭제했습니다.'); }).catch(saveFail); }
  };
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]'); if (!t) return;
    var fn = A[t.dataset.act]; if (fn) fn(t);
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'thrRange') { S.thr = Number(e.target.value); var tv = $('#thrVal'); if (tv) tv.textContent = S.thr + '%'; return; }
    var b = e.target.dataset && e.target.dataset.bind; if (!b) return;
    var p = b.split('.'); (p[0] === 'form' ? S.form : S.cmp)[p[1]] = e.target.value;
  });
  document.addEventListener('change', function (e) {
    var t = e.target; if (!t || !t.classList) return;
    if (t.id === 'thrRange') { S.thr = Number(t.value); lsSet('cc_thr', String(S.thr)); render(); return; }
    if (t.classList.contains('fin')) {
      if (t.dataset.target === 'import') { var f = t.files && t.files[0]; t.value = ''; if (f) doImport(f); }
      else onFile(e);
    }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && sheetFn) closeSheet(); });

  /* ---------- 시작 ---------- */
  render();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then(function (p) { S.persisted = p; }).catch(function () {}); } catch (e) {}
  try { S.standalone = !!(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches); } catch (e) {}
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); S.installEvt = e; if (sheetFn === sheetSettings) paintSheet(); });
  window.addEventListener('appinstalled', function () { S.installEvt = null; S.standalone = true; toast('앱을 설치했습니다.'); if (sheetFn === sheetSettings) paintSheet(); });
  /* 시험용: 계산 엔진 확인 */
  window.__cc = { featuresOf: featuresOf, compareFeat: compareFeat };
  openDB().then(function (d) { idb = d; return Promise.all([dbAll('items'), dbAll('decisions')]); }).then(function (r) {
    S.items = r[0].map(normItem).sort(function (a, b) { return b.createdAt - a.createdAt; });
    S.decisions = r[1].sort(function (a, b) { return b.createdAt - a.createdAt; });
  }).catch(function () { idb = null; S.storage = 'mem'; }).then(function () { S.ready = true; render(); });
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0 && !(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform())) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function () {}); });
}
</script>
